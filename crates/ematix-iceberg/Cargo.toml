[package]
name = "ematix-iceberg"
version.workspace = true
edition.workspace = true
# Local rust-version override (workspace pins 1.80). The `iceberg`
# feature pulls `iceberg = "0.6"` which itself pins MSRV to 1.85;
# users opting into that feature need a newer toolchain. The contract
# layer (default-features) keeps the workspace MSRV bound and stays
# usable on 1.80.
rust-version = "1.85"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Iceberg table-format integration for ematix-parquet sidecar indexes. Defines the extension fields appended to Iceberg `data_file` manifest entries (per-file sidecar path + per-index summaries) for file-level pruning before opening sidecars."
readme = "../../README.md"

[lib]
name = "ematix_iceberg"

[dependencies]
# Reuse the codec's `Key` type so the iceberg layer and the per-file
# sidecar layer agree on physical-type representation end-to-end. The
# crate also re-exports `PhysicalType` which we mirror onto our
# `SummaryKey` discriminant.
ematix-parquet-codec = { path = "../ematix-parquet-codec", version = "0.15" }
# Iceberg-rust. Optional; gates the `iceberg_rs` module that wires the
# extension JSON onto real `iceberg::spec::DataFile` entries. Pulls a
# big dep tree (tokio, opendal, arrow) so default builds stay light.
iceberg = { version = "0.6", optional = true }

[dev-dependencies]
# Async test runtime for `collect_data_files` etc. — the iceberg-rust
# manifest accessors are all `async`. Dev-only; production callers
# bring their own runtime.
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true

[features]
# Enable the `iceberg_rs` integration module — encode/decode of our
# extension JSON into `DataFile.key_metadata`, plus prune-by-summary
# helpers over Vec<DataFile>. Off by default.
iceberg = ["dep:iceberg"]
